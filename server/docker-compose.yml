name: layr-server

services:
  postgres:
    image: postgres:17.6-alpine3.22
    environment:
      POSTGRES_DB: layr
      POSTGRES_USER: layr
      POSTGRES_PASSWORD: layr_local
    ports:
      - "5432:5432"
    volumes:
      - layr-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U layr -d layr"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:8.2.1-alpine3.22
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  layr-postgres:
